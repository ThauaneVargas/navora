# Referência do que roda no Render (Blueprint). Os serviços reais foram criados
# à mão em Oregon (conferido no painel em 23/10) — mantenha este arquivo igual
# ao painel. Ao contratar o plano pago (até 19/11/2026, quando o banco grátis
# expira), troque `plan` aqui também. Ver docs/checklist-lancamento.md §1.
services:
  - type: web
    name: navora-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main
    # Monitor e Render consultam este caminho; responde 503 se o banco cair.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Segredos: `sync: false` = o valor fica SÓ no painel do Render, nunca
      # neste arquivo (o repositório é público). O servidor não sobe em produção
      # se faltar algum ou se o JWT_SECRET for fraco (src/config/env.validation.ts).
      # Ver docs/seguranca-chaves.md.
      - key: DATABASE_URL # Neon (desde 03/11/2026)
        sync: false
      - key: JWT_SECRET # mínimo 32 caracteres aleatórios
        sync: false
      - key: CORS_ORIGINS # https://navora-nine.vercel.app
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: PORT
        value: "3000"
