services:
  - type: web
    name: navora-backend
    runtime: node
    plan: free
    region: ohio
    rootDir: .
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: navora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "3000"

databases:
  - name: navora-db
    plan: free
    region: ohio
